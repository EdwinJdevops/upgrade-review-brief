name: Test and demonstrate upgrade review

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_model:
        description: Download the pinned BGE model and run the CPU demonstration
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install browser and parser packages
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-web.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v

  model-demo:
    if: (github.event_name == 'workflow_dispatch' && inputs.run_model) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[model-demo]'))
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install CPU inference packages
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir transformers==4.57.1 PyYAML==6.0.3
          python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-web.txt
      - name: Prepare verified model and migration source
        run: |
          python prepare_brief_source.py
          python download_reranker.py .models/bge-reranker-base
      - name: Produce review brief
        run: |
          python upgrade_brief.py brief-cases/kong-readiness.json --root . --model-dir .models/bge-reranker-base --format json > runner-brief.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          from upgrade_brief import markdown
          report = json.loads(Path('runner-brief.json').read_text())
          if report['status'] != 'REVIEW_REQUIRED' or report['model_calls'] < 1:
              raise RuntimeError('Expected an actual model-ranked review report')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(markdown(report))
          print(json.dumps({'model': report['model'], 'model_calls': report['model_calls'], 'passages_omitted': report['passages_omitted'], 'status': report['status']}, indent=2))
          PY
      - name: Exercise browser route with actual CPU model
        run: |
          python verify_web_model.py
          python - <<'PY'
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('\n## Actual browser-route inference\n\n```json\n' + Path('runner-web-result.json').read_text() + '```\n')
          PY

  determinism:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[determinism]')
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install -r requirements-web.txt
          python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.57.1
      - name: Prepare pinned inputs
        run: |
          python prepare_brief_source.py
          python download_reranker.py .models/bge-reranker-base
      - name: Compare CLI output with the local frozen hash
        run: python verification/check_determinism.py --runs 1 --model-dir .models/bge-reranker-base --output-directory verification/phase2/github --expected-hash 59fe287518e29c37dc810687281a384bcbfd46fa7ec6bba37b19c405f7ec518e
      - name: Preserve actual runner outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: determinism-raw-output
          path: verification/phase2/github/
          if-no-files-found: error
          retention-days: 7
